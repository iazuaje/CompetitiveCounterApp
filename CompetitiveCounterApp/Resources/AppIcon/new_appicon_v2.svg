<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo oscuro (Material Indigo) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    
    <!-- Gradiente de victoria (Material Amber) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    
    <!-- Sombra base para efecto de profundidad -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo de la aplicación (Forma de Squircle para previsualización) -->
  <rect x="8" y="8" width="92" height="92" rx="24" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Barra Izquierda (Jugador 2 / Estadísticas) -->
  <rect x="24" y="56" width="16" height="24" rx="2" fill="#00E5FF"/>
  
  <!-- Barra Derecha (Jugador 3 / Estadísticas) -->
  <rect x="68" y="66" width="16" height="14" rx="2" fill="#FF1744"/>
  
  <!-- Barra Central (Jugador 1 / Ganador) -->
  <rect x="46" y="44" width="16" height="36" rx="2" fill="url(#gold)"/>

  <!-- Línea Base del Gráfico/Podio -->
  <path d="M 20 84 L 88 84" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Corona sobre la barra central indicando el contador de victorias -->
  <path d="M 46 40 L 44 26 L 50 32 L 54 20 L 58 32 L 64 26 L 62 40 Z" fill="url(#gold)" filter="url(#shadow)"/>
</svg>
