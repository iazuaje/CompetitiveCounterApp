<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <!-- Fondo del ícono (Tono avena cálido): a sangre completa, el launcher lo recorta con su máscara -->
  <rect width="108" height="108" fill="#F4EFE6"/>

  <!--
    Ícono adaptativo de Android: lienzo 108, máscara visible ~72 (círculo) y zona segura de 66 centrada.
    El contenido original ocupa ~80x66 (x 14..94, y 20..86, centro 54,53); se escala a 0.6 y se centra
    para quedar en ~48x40 dentro de la zona segura, con aire respecto del borde circular.
  -->
  <g transform="translate(54 54) scale(0.6) translate(-54 -53)">
    <!-- Barra Derecha (3er lugar - Gris/Arena cálido muy suave) -->
    <path d="M 67 64 Q 67 60 71 60 L 81 60 Q 85 60 85 64 L 85 84 L 67 84 Z" fill="#EEDCD3"/>

    <!-- Barra Izquierda (2do lugar - Melocotón apagado) -->
    <path d="M 23 54 Q 23 50 27 50 L 37 50 Q 41 50 41 54 L 41 84 L 23 84 Z" fill="#E3B5A4"/>

    <!-- Barra Central (1er lugar - Terracota apagado) -->
    <path d="M 45 44 Q 45 40 49 40 L 59 40 Q 63 40 63 44 L 63 84 L 45 84 Z" fill="#D98A6C"/>

    <!-- Línea Base (Marrón oscuro apagado) -->
    <path d="M 16 84 L 92 84" stroke="#5C4742" stroke-width="4" stroke-linecap="round"/>

    <!-- Corona Minimalista sobre el ganador -->
    <path d="M 46 34 L 43 25 L 50 28 L 54 22 L 58 28 L 65 25 L 62 34 Z"
          fill="#5C4742"
          stroke="#5C4742"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>
</svg>
